name: macOS release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    name: Identify release branch
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      branch: ${{ steps.source.outputs.branch }}
    steps:
      - name: Identify the release PR for this commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_HEAD_REF:-}"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # main에 실제 병합된 같은 저장소의 릴리스 PR만 배포한다.
            branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --paginate |
              jq -r --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
                .[] | select(.merged_at != null and .merge_commit_sha == $sha and
                .base.ref == "main" and .head.repo.full_name == $repo and
                (.head.ref | startswith("release/"))) | .head.ref')
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  validate:
    name: ${{ github.event_name == 'push' && 'Validate merged release' || 'Validate release PR' }}
    needs: candidate
    if: needs.candidate.outputs.branch != ''
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Check release version and notes
        id: version
        env:
          RELEASE_BRANCH: ${{ needs.candidate.outputs.branch }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          pattern = r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          if not re.fullmatch(pattern, version) or os.environ["RELEASE_BRANCH"] != f"release/{version}":
              raise SystemExit("후보 버전과 릴리스 브랜치 이름을 확인하세요.")
          # 검토용 병합 커밋과 실제 병합 커밋 모두 첫 부모에서 직전 배포를 찾는다.
          tags = subprocess.check_output(["git", "tag", "--merged", "HEAD^1"], text=True).splitlines()
          previous = max(tuple(map(int, tag[1:].split("."))) for tag in tags if re.fullmatch("v" + pattern, tag))
          major, minor, patch = previous
          if tuple(map(int, version.split("."))) not in {(major + 1, 0, 0), (major, minor + 1, 0), (major, minor, patch + 1)}:
              raise SystemExit("직전 태그에서 주·부·패치 중 한 단계 올려야 합니다.")
          if not Path(f"docs/releases/{version}.md").read_text().strip():
              raise SystemExit("사용자용 릴리스 노트가 필요합니다.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PY
          uv lock --check
      - run: mise run check
      - name: Verify MCP stdio transport
        run: uv run --locked --extra menubar pytest -q tests/integration/mcp/test_stdio.py

  package:
    name: Build and sign release DMG
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Prepare Developer ID signing and notarization
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        shell: bash
        run: |
          # 자격이 없으면 Gatekeeper가 막는 임시 서명본을 게시하지 않고 멈춘다.
          if [[ -z "$DEVELOPER_ID_P12_BASE64" || -z "$DEVELOPER_ID_P12_PASSWORD" ||
                -z "$NOTARY_API_KEY_BASE64" || -z "$NOTARY_API_KEY_ID" ]]; then
            echo "::error::production 환경에 Developer ID 인증서와 공증 API 키 시크릿을 등록하세요."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # codesign과 notarytool이 기본 키체인에서 인증서와 공증 프로필을 찾는다.
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          # 인증서와 API 키 파일은 키체인에 넣은 직후 지운다.
          certificate="$RUNNER_TEMP/developer-id.p12"
          base64 --decode <<< "$DEVELOPER_ID_P12_BASE64" > "$certificate"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # pipefail에서 awk가 먼저 끝나 앞 명령이 중단되지 않도록 목록을 먼저 받는다.
          identities=$(security find-identity -v -p codesigning "$keychain")
          identity=$(awk -F'"' '/Developer ID Application/ { print $2; exit }' <<< "$identities")
          test -n "$identity"
          key="$RUNNER_TEMP/notary-key.p8"
          base64 --decode <<< "$NOTARY_API_KEY_BASE64" > "$key"
          # 개인 API 키는 발급자 ID가 없고 팀 API 키만 발급자 ID를 요구한다.
          issuer=()
          if [[ -n "$NOTARY_API_ISSUER_ID" ]]; then
            issuer=(--issuer "$NOTARY_API_ISSUER_ID")
          fi
          xcrun notarytool store-credentials catch-release --key "$key" --key-id "$NOTARY_API_KEY_ID" "${issuer[@]}"
          rm "$key"
          {
            echo "CODESIGN_IDENTITY=$identity"
            echo "NOTARY_PROFILE=catch-release"
          } >> "$GITHUB_ENV"
      - name: Build release DMG
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$SPARKLE_PUBLIC_ED_KEY"
          mise run package
      - name: Verify packaged app from read-only DMG
        working-directory: dist
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          dmg="Catch-${VERSION}-macOS-arm64.dmg"
          shasum -a 256 -c "$dmg.sha256"
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir"' EXIT
          app="$mount_dir/Catch.app"
          codesign --verify --deep --strict "$app"
          # 처음 내려받은 Mac의 Gatekeeper가 확인할 공증 표와 Apple 등록 상태를 게시 전에 확인한다.
          xcrun stapler validate "$dmg"
          codesign --verify --strict -R=notarized --check-notarization "$app"
          "$app/Contents/MacOS/MaengMate" --check | jq -e --arg version "$VERSION" '.ok and .architecture == "arm64" and .version == $version'
      - name: Sign and verify update feed
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: uv run --locked python packaging/sparkle_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-package
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Remove signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi

  publish:
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-package
          path: dist
      - name: Publish verified package and reviewed notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tag="v$VERSION"
          dmg="Catch-${VERSION}-macOS-arm64.dmg"
          (cd dist && sha256sum -c "$dmg.sha256")
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$tag" -m "Release Catch $VERSION"
            git push origin "refs/tags/$tag"
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              echo "$tag is already published"
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Catch $tag" --notes-file "docs/releases/$VERSION.md"
          fi
          gh release upload "$tag" "dist/$dmg" "dist/$dmg.sha256" dist/appcast.xml --clobber
          gh release edit "$tag" --draft=false
