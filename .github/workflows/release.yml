name: macOS release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ github.event.pull_request.merged && 'Validate and build DMG' || 'Validate release PR' }}
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release/') &&
      (github.event.action != 'closed' || github.event.pull_request.merged)
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Check release version and notes
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          pattern = r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          if not re.fullmatch(pattern, version) or os.environ["GITHUB_HEAD_REF"] != f"release/{version}":
              raise SystemExit("후보 버전과 릴리스 브랜치 이름을 확인하세요.")
          # 검토용 병합 커밋과 실제 병합 커밋 모두 첫 부모에서 직전 배포를 찾는다.
          tags = subprocess.check_output(["git", "tag", "--merged", "HEAD^1"], text=True).splitlines()
          previous = max(tuple(map(int, tag[1:].split("."))) for tag in tags if re.fullmatch("v" + pattern, tag))
          major, minor, patch = previous
          if tuple(map(int, version.split("."))) not in {(major + 1, 0, 0), (major, minor + 1, 0), (major, minor, patch + 1)}:
              raise SystemExit("직전 태그에서 주·부·패치 중 한 단계 올려야 합니다.")
          if not Path(f"docs/releases/{version}.md").read_text().strip():
              raise SystemExit("사용자용 릴리스 노트가 필요합니다.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PY
          uv lock --check
      - run: mise run check
      - name: Verify MCP stdio transport
        run: uv run --locked --extra menubar pytest -q tests/integration/mcp/test_stdio.py
      # 배포용 패키지는 병합된 커밋에서만 생성하고 검증·전달한다.
      - name: Build release DMG
        if: github.event.pull_request.merged
        run: mise run package
      - name: Verify packaged app from read-only DMG
        if: github.event.pull_request.merged
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg="Maeng-Mate-${VERSION}-macOS-arm64.dmg"
          shasum -a 256 -c "$dmg.sha256"
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir"' EXIT
          app="$mount_dir/Maeng Mate.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/MaengMate" --check | jq -e --arg version "$VERSION" '.ok and .architecture == "arm64" and .version == $version'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event.pull_request.merged
        with:
          name: macos-package
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    if: github.event.pull_request.merged
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-package
          path: dist
      - name: Publish verified package and reviewed notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tag="v$VERSION"
          dmg="Maeng-Mate-${VERSION}-macOS-arm64.dmg"
          (cd dist && sha256sum -c "$dmg.sha256")
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$tag" -m "Release Maeng Mate $VERSION"
            git push origin "refs/tags/$tag"
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              echo "$tag is already published"
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Maeng Mate $tag" --notes-file "docs/releases/$VERSION.md"
          fi
          gh release upload "$tag" "dist/$dmg" "dist/$dmg.sha256" --clobber
          gh release edit "$tag" --draft=false
