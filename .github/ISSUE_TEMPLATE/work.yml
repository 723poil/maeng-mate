name: 작업 이슈
description: 독립적으로 수정하고 검증할 문제를 등록합니다.
body:
  - type: markdown
    attributes:
      value: 제목에 대상과 변경할 동작을 적어 주세요. 등록 후 유형과 우선순위 라벨을 하나씩 적용하고 착수 시 작업자를 지정합니다.
  - type: textarea
    id: impact
    attributes:
      label: 문제와 영향
      description: 누가 어떤 조건에서 영향을 받는지, 우회 방법이 있는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 확인 근거
      description: 재현 절차, 관찰한 결과 또는 관련 코드·ADR을 적어 주세요. 제안이라면 현재 제약을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 수정 뒤 확인할 동작과 보존해야 할 기존 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 관련 이슈
      description: 선행 작업이나 관련 이슈가 있으면 번호로 연결해 주세요.
